<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Ahhhh // ahhhh</title>
  <style>
    :root {
      --bg: #07090f;
      --panel: #0e1320;
      --panel-2: #121829;
      --border: #1e2840;
      --text: #f3f6fc;
      --muted: #9aa7bf;
      --pink: #ff2a85;
      --cyan: #22d3ee;
      --lime: #a3e635;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: var(--bg);
      color: var(--text);
      font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
    }
    .wrap {
      max-width: 1120px;
      margin: 0 auto;
      padding: 20px 18px 48px;
    }
    .topbar {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      align-items: center;
      margin-bottom: 14px;
    }
    .brand {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      font-weight: 900;
      font-size: 1.5rem;
      letter-spacing: 0.04em;
      color: var(--pink);
    }
    .cli-pill {
      background: var(--lime);
      color: #081104;
      font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
      font-size: 0.72rem;
      font-weight: 800;
      padding: 2px 7px;
      border-radius: 5px;
    }
    .search-box {
      flex: 1 1 260px;
      background: var(--panel);
      border: 1px solid var(--border);
      color: var(--text);
      border-radius: 8px;
      padding: 10px 12px;
      font-size: 0.95rem;
    }
    .btn {
      background: var(--panel-2);
      color: var(--text);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 9px 14px;
      font-weight: 700;
      cursor: pointer;
    }
    .btn-pink {
      background: var(--pink);
      border-color: var(--pink);
      color: #fff;
    }
    .btn-cyan {
      background: transparent;
      border-color: var(--cyan);
      color: var(--cyan);
    }
    .bar-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
      margin-bottom: 16px;
    }
    @media (max-width: 820px) {
      .bar-row { grid-template-columns: 1fr; }
    }
    .box {
      background: var(--panel);
      border: 1px dashed var(--border);
      border-radius: 10px;
      padding: 10px 12px;
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      align-items: center;
    }
    .box-label {
      font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
      font-size: 0.76rem;
      font-weight: 800;
      color: var(--cyan);
    }
    .box-label.amber { color: #facc15; }
    .input-sm {
      flex: 1 1 140px;
      min-width: 110px;
      background: var(--bg);
      border: 1px solid var(--border);
      color: var(--text);
      border-radius: 7px;
      padding: 7px 10px;
      font-size: 0.88rem;
    }
    .cats {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-bottom: 16px;
    }
    .cat-btn {
      background: var(--panel);
      border: 1px solid var(--border);
      color: var(--muted);
      border-radius: 8px;
      padding: 6px 10px;
      font-size: 0.82rem;
      font-weight: 700;
      cursor: pointer;
    }
    .cat-btn.active {
      background: var(--pink);
      border-color: var(--pink);
      color: #fff;
    }
    .meta-bar {
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
      margin-bottom: 14px;
      color: var(--muted);
      font-size: 0.9rem;
    }
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(310px, 1fr));
      gap: 14px;
    }
    .card {
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 16px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      gap: 12px;
    }
    .card-top {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 10px;
    }
    .card-title { margin: 0; font-size: 1.05rem; font-weight: 800; }
    .badge {
      font-size: 0.74rem;
      font-weight: 700;
      color: var(--cyan);
      background: rgba(34, 211, 238, 0.1);
      border: 1px solid rgba(34, 211, 238, 0.35);
      padding: 2px 8px;
      border-radius: 6px;
      white-space: nowrap;
    }
    .desc { margin: 8px 0 0; color: var(--muted); font-size: 0.88rem; line-height: 1.4; }
    .repo-chip {
      display: inline-block;
      margin-top: 8px;
      font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
      font-size: 0.76rem;
      color: var(--muted);
      background: var(--bg);
      border: 1px solid var(--border);
      padding: 2px 7px;
      border-radius: 6px;
    }
    .card-foot {
      display: flex;
      justify-content: flex-end;
      align-items: center;
      gap: 8px;
    }
    .status {
      margin-bottom: 12px;
      color: var(--cyan);
      font-size: 0.88rem;
      min-height: 1.2em;
    }
    footer {
      margin-top: 28px;
      padding-top: 16px;
      border-top: 1px solid var(--border);
      display: flex;
      justify-content: space-between;
      align-items: center;
      color: var(--muted);
      font-size: 0.84rem;
    }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="topbar">
      <div class="brand">Ahhhh <span class="cli-pill">ahhhh</span></div>
      <input id="searchInput" class="search-box" type="search" placeholder="Search apps or categories..." />
      <button id="installedBtn" class="btn">Installed</button>
      <button id="diceBtn" class="btn" title="Random app">🎲</button>
    </div>

    <div class="bar-row">
      <div class="box">
        <span class="box-label">GITHUB RELEASE</span>
        <input id="ghRepoInput" class="input-sm" type="text" placeholder="owner/repo or URL" />
        <button id="ghInspectBtn" class="btn btn-cyan">Inspect</button>
        <button id="ghInstallBtn" class="btn btn-pink">Install</button>
      </div>

      <div id="dropZone" class="box">
        <span class="box-label amber">LOCAL .APPIMAGE</span>
        <input id="localFileInput" type="file" accept=".AppImage,.appimage,.tar.gz,.tgz,.tar.xz,.zip" hidden />
        <button id="pickFileBtn" class="btn">Pick</button>
        <span id="dropHint" style="color:var(--muted);font-size:0.84rem;">drop .AppImage</span>
        <input id="localNameInput" class="input-sm" type="text" placeholder="Optional name" />
        <button id="localInstallBtn" class="btn btn-pink">Install</button>
      </div>
    </div>

    <div id="cats" class="cats"></div>
    <div id="status" class="status"></div>

    <div class="meta-bar">
      <span id="countLabel">0 apps</span>
      <div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap;">
        <button id="shuffleBtn" class="btn">Sorted: Random</button>
        <button id="firstBtn" class="btn">First</button>
        <button id="prevBtn" class="btn">Prev</button>
        <span id="pageLabel">Page 1 / 1</span>
        <button id="nextBtn" class="btn">Next Page</button>
        <button id="lastBtn" class="btn">Last</button>
      </div>
    </div>

    <div id="grid" class="grid"></div>

    <footer>
      <span>Ahhhh // ahhhh · Linux AppImage &amp; Release Manager</span>
      <button id="helpBtn" class="btn">How It Works &amp; Uninstall</button>
    </footer>
  </div>

  <script>
    const state = {
      items: [],
      installed: {},
      category: "All",
      search: "",
      onlyInstalled: false,
      page: 1,
      pageSize: 6,
      selectedFile: null
    };

    const $ = (id) => document.getElementById(id);

    function setStatus(msg) {
      $("status").textContent = msg || "";
    }

    function filteredItems() {
      const q = state.search.trim().toLowerCase();
      return state.items.filter((it) => {
        const slug = (it.name || "").toLowerCase().replace(/[^a-z0-9]+/g, "-").replace(/^-|-$/g, "");
        if (state.onlyInstalled && !state.installed[slug]) return false;
        if (state.category !== "All") {
          const cats = (it.categories || []).join(" ");
          if (!cats.toLowerCase().includes(state.category.toLowerCase())) return false;
        }
        if (!q) return true;
        const hay = `${it.name || ""} ${it.description || ""} ${(it.categories || []).join(" ")} ${(it.github || []).join(" ")}`.toLowerCase();
        return hay.includes(q);
      });
    }

    function renderCats() {
      const counts = { All: state.items.length };
      for (const it of state.items) {
        const c = (it.categories && it.categories[0]) || "Other";
        counts[c] = (counts[c] || 0) + 1;
      }
      const order = ["All", "Web & Browsers", "Audio & Video", "Dev & Code", "Games", "Graphics & 3D", "Network & Chat", "Office & Notes", "System & Tools", "Science & Edu", "Other"];
      $("cats").innerHTML = order
        .filter((k) => counts[k] !== undefined)
        .map((k) => `<button class="cat-btn ${state.category === k ? "active" : ""}" data-cat="${k}">${k} ${counts[k]}</button>`)
        .join("");

      $("cats").querySelectorAll(".cat-btn").forEach((b) => {
        b.onclick = () => {
          state.category = b.dataset.cat;
          state.page = 1;
          render();
        };
      });
    }

    function render() {
      renderCats();
      const list = filteredItems();
      const totalPages = Math.max(1, Math.ceil(list.length / state.pageSize));
      if (state.page > totalPages) state.page = totalPages;
      const start = (state.page - 1) * state.pageSize;
      const slice = list.slice(start, start + state.pageSize);

      $("countLabel").textContent = `${list.length} apps`;
      $("pageLabel").textContent = `Page ${state.page} / ${totalPages}`;

      if (!slice.length) {
        $("grid").innerHTML = `<p style="color:var(--muted);">No matching apps found.</p>`;
        return;
      }

      $("grid").innerHTML = slice.map((it) => {
        const name = it.name || "App";
        const cat = (it.categories && it.categories[0]) || "Other";
        const repo = Array.isArray(it.github) && it.github[0] ? it.github[0] : "";
        return `
          <article class="card">
            <div>
              <div class="card-top">
                <h3 class="card-title">${name}</h3>
                <span class="badge">${cat}</span>
              </div>
              <p class="desc">${it.description || ""}</p>
              ${repo ? `<span class="repo-chip">${repo}</span>` : ""}
            </div>
            <div class="card-foot">
              <button class="btn btn-pink install-cat-btn" data-name="${name}">Install</button>
            </div>
          </article>
        `;
      }).join("");

      $("grid").querySelectorAll(".install-cat-btn").forEach((btn) => {
        btn.onclick = async () => {
          const appName = btn.dataset.name;
          const match = state.items.find((x) => x.name === appName);
          const dl = match && Array.isArray(match.links) && match.links[0] ? match.links[0].url : "";
          if (!dl) {
            setStatus(`No direct download URL listed for ${appName}.`);
            return;
          }
          setStatus(`Installing ${appName}...`);
          const res = await fetch("/api/install/url", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ name: appName, url: dl })
          });
          const data = await res.json();
          setStatus(data.error ? `Error: ${data.error}` : `Installed ${appName} via Ahhhh.`);
          await loadInstalled();
        };
      });
    }

    async function loadFeed() {
      try {
        const res = await fetch("/api/feed");
        const data = await res.json();
        state.items = Array.isArray(data.items) ? data.items : [];
      } catch (e) {
        state.items = [];
      }
      render();
    }

    async function loadInstalled() {
      try {
        const res = await fetch("/api/installed");
        const data = await res.json();
        const map = {};
        for (const a of (data.apps || [])) {
          if (a.slug) map[a.slug] = a;
        }
        state.installed = map;
      } catch (_) {}
    }

    $("searchInput").oninput = (e) => { state.search = e.target.value; state.page = 1; render(); };
    $("installedBtn").onclick = () => { state.onlyInstalled = !state.onlyInstalled; state.page = 1; render(); };
    $("shuffleBtn").onclick = () => {
      for (let i = state.items.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [state.items[i], state.items[j]] = [state.items[j], state.items[i]];
      }
      state.page = 1;
      render();
    };
    $("diceBtn").onclick = () => {
      const list = filteredItems();
      if (!list.length) return;
      const pick = list[Math.floor(Math.random() * list.length)];
      setStatus(`🎲 Picked: ${pick.name}`);
    };
    $("firstBtn").onclick = () => { state.page = 1; render(); };
    $("prevBtn").onclick = () => { if (state.page > 1) { state.page--; render(); } };
    $("nextBtn").onclick = () => {
      const total = Math.max(1, Math.ceil(filteredItems().length / state.pageSize));
      if (state.page < total) { state.page++; render(); }
    };
    $("lastBtn").onclick = () => {
      state.page = Math.max(1, Math.ceil(filteredItems().length / state.pageSize));
      render();
    };

    $("ghInspectBtn").onclick = async () => {
      const repo = $("ghRepoInput").value.trim();
      const name = $("localNameInput").value.trim();
      if (!repo) return;
      setStatus(`Inspecting ${repo}...`);
      const res = await fetch(`/api/github/inspect?repo=${encodeURIComponent(repo)}&name=${encodeURIComponent(name)}`);
      const data = await res.json();
      setStatus(data.error ? `Error: ${data.error}` : `${data.repo} ${data.tag} -> ${data.asset_name} (${data.kind})`);
    };

    $("ghInstallBtn").onclick = async () => {
      const repo = $("ghRepoInput").value.trim();
      const name = $("localNameInput").value.trim();
      if (!repo) return;
      setStatus(`Installing from ${repo}...`);
      const res = await fetch("/api/install/url", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ name, url: repo })
      });
      const data = await res.json();
      setStatus(data.error ? `Error: ${data.error}` : `Installed from ${repo} via Ahhhh.`);
      await loadInstalled();
    };

    $("pickFileBtn").onclick = () => $("localFileInput").click();
    $("localFileInput").onchange = (e) => {
      const f = e.target.files && e.target.files[0];
      if (f) {
        state.selectedFile = f;
        $("dropHint").textContent = f.name;
      }
    };
    $("dropZone").ondragover = (e) => e.preventDefault();
    $("dropZone").ondrop = (e) => {
      e.preventDefault();
      const f = e.dataTransfer && e.dataTransfer.files && e.dataTransfer.files[0];
      if (f) {
        state.selectedFile = f;
        $("dropHint").textContent = f.name;
      }
    };
    $("localInstallBtn").onclick = async () => {
      if (!state.selectedFile) return;
      const fd = new FormData();
      fd.append("file", state.selectedFile);
      fd.append("name", $("localNameInput").value.trim());
      setStatus(`Installing ${state.selectedFile.name}...`);
      const res = await fetch("/api/install/local", { method: "POST", body: fd });
      const data = await res.json();
      setStatus(data.error ? `Error: ${data.error}` : `Installed ${state.selectedFile.name} via Ahhhh.`);
      await loadInstalled();
    };

    $("helpBtn").onclick = () => {
      setStatus("Ahhhh (CLI: ahhhh) installs AppImages, archives, and binaries into /opt/appimages with /usr/local/bin symlinks and desktop entries.");
    };

    (async () => {
      await loadInstalled();
      await loadFeed();
    })();
  </script>
</body>
</html>
